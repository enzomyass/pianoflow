name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Bundle recorded grand piano (Salamander Grand Piano, CC BY 3.0)
        run: |
          mkdir -p public/samples/piano
          cd public/samples/piano
          ok=0
          for oct in 0 1 2 3 4 5 6 7 8; do
            for n in C Ds Fs A; do
              f="${n}${oct}.mp3"
              case "$f" in A0.mp3|C8.mp3) ;; *0.mp3|Ds8.mp3|Fs8.mp3|A8.mp3) continue ;; esac
              for base in "https://tonejs.github.io/audio/salamander" "https://raw.githubusercontent.com/Tonejs/audio/master/salamander"; do
                if curl -fsSL --retry 3 --retry-delay 2 -o "$f" "$base/$f" && [ -s "$f" ]; then ok=$((ok+1)); break; fi
                rm -f "$f"
              done
            done
          done
          ls -la
          if [ "$ok" -lt 30 ]; then
            echo "::warning title=Piano samples::Only $ok/30 grand piano samples downloaded - the app will use the synthesized piano for missing ones."
          else
            echo "::notice title=Piano samples::All $ok grand piano samples bundled ($(du -sh . | cut -f1))."
          fi

      - name: Build web bundle (Vite)
        run: npm run build

      - name: Verify bundle
        run: |
          test -f dist/index.html
          ls dist/assets/*.js dist/assets/*.css
          echo "::notice title=Bundle::$(ls dist/samples/piano 2>/dev/null | wc -l) piano samples in dist, JS $(du -ck dist/assets/*.js | tail -1 | cut -f1) KB"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK at: $SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > "$RUNNER_TEMP/local.properties"
          echo "ANDROID_SDK_DIR=$SDK" >> "$GITHUB_ENV"

      - name: Generate Capacitor Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          npx cap sync android
          echo "sdk.dir=$ANDROID_SDK_DIR" > android/local.properties

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/PianoFlow-debug-${GITHUB_SHA::7}.apk"
          echo "::notice title=APK::PianoFlow-debug-${GITHUB_SHA::7}.apk built ($(du -h out/*.apk | cut -f1)), samples inside: $(unzip -l out/*.apk | grep -c 'samples/piano/.*mp3')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
